<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安全跳转中 - 机场指南针</title>
    
    <!-- 严格合规：防止搜索引擎收录该跳转承接页与传递权重 -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <style>
      *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #020617;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        background-color: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 1.25rem;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .spinner {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.5rem;
        border: 4px solid #1e293b;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .title { font-size: 1.25rem; font-weight: 800; margin: 0 0 0.5rem; color: #fff; }
      .desc { font-size: 0.75rem; color: #94a3b8; line-height: 1.6; margin: 0 0 1.5rem; }
      .coupon-box {
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid rgba(245, 158, 11, 0.3);
        border-radius: 0.75rem;
        padding: 0.75rem;
        margin-bottom: 1.5rem;
        font-size: 0.75rem;
      }
      .coupon-code {
        font-family: monospace;
        font-weight: 700;
        color: #fcd34d;
        margin-left: 0.25rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        font-size: 0.8125rem;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(to right, #4f46e5, #0284c7);
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .btn:hover { opacity: 0.9; }
      .footer { margin-top: 1.5rem; font-size: 0.6875rem; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>

      <h1 class="title" id="target-name">正在安全跳转至官网...</h1>
      <p class="desc" id="status-text">
        正在自动建立安全隔离隧道，并为您匹配专属优惠折扣。<br />
        系统将在 1 秒内自动完成 302 重定向...
      </p>

      <div class="coupon-box" id="coupon-area" style="display: none;">
        <span style="color: #94a3b8;">本站专属立减优惠码：</span>
        <span class="coupon-code" id="coupon-val"></span>
        <div style="color: #fbbf24; font-size: 0.6875rem; margin-top: 0.25rem;" id="coupon-desc"></div>
      </div>

      <a
        id="manual-link"
        href="./index.html"
        target="_blank"
        rel="nofollow sponsored noopener noreferrer"
        class="btn"
      >
        <span>未自动跳转？点击立即直达官网</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

      <div class="footer">
        © 2026 机场指南针 · 推广外链 302 临时隔离中枢
      </div>
    </div>

    <script is:inline>
      (function() {
        // 核心推广直连映射表 (302 映射字典)
        var REDIRECT_MAP = {
          'shandianshu': {
            name: '闪电鼠 (旗舰专线)',
            url: 'https://chenpin.shandianshuaff.com/#/?code=m28TvPVX',
            coupon: 'sd88',
            discount: '8折首发立减优惠'
          },
          'dalaoyun': {
            name: '大佬云',
            url: 'https://chenpin01.dalaoyunaff.com/#/?code=GQ6CL6Km',
            coupon: 'dly88',
            discount: '8元月付专享'
          },
          'liulianyun': {
            name: '榴莲云',
            url: 'https://chenpingan.liulianyunaff.com/#/?code=7pdjs9zt',
            coupon: 'll88',
            discount: '追剧专用8折券'
          },
          'shenxing': {
            name: '神行加速',
            url: 'https://chenpingan01.shenxingaff.com/#/?code=RZ48f9wP',
            coupon: 'sx0077',
            discount: '高带宽专线立减'
          },
          'yunjiexian': {
            name: '云界线',
            url: 'https://chenpinga.yunjiexianaff.com/#/?code=rTCMGvQT',
            coupon: 'yjx888',
            discount: '专属折扣通道'
          },
          'huanqiuti': {
            name: '环球梯',
            url: 'https://chenpingan01.huanqiutiaff.com/#/?code=FGCcYdFo',
            coupon: 'hq66',
            discount: '超值8元战神'
          },
          'jilianyun': {
            name: '极连云',
            url: 'https://haozevpn.jlyvipaff.com/#/?code=6h2TMD5b',
            coupon: 'jly888',
            discount: '商务专属优惠'
          },
          'guangshuyun': {
            name: '光速云',
            url: 'https://hu8jnfv.gsyvipaff.com/#/?code=vELLETdq',
            coupon: 'GSY888',
            discount: 'IPLC专线立减'
          },
          'guangnianti': {
            name: '光年梯',
            url: 'https://gnt001.gntvipaff.cc/#/?code=rN3ybxa7',
            coupon: 'GNT2026',
            discount: '7元平民战神优惠'
          },
          'edgenova': {
            name: '边缘节点',
            url: 'https://wep.edgenovaaff.com/#/?code=papME7sh',
            coupon: 'xk808',
            discount: '定制出海专享'
          },
          'sujie': {
            name: '速界',
            url: 'https://pygllc.speedworldaff.cc/#/?code=ll8LjYBJ',
            coupon: 'sujie80',
            discount: '8折限时优惠'
          }
        };

        // 解析 URL 参数 ?id=xxx 或 ?aff=xxx 或 ?to=xxx
        var params = new URLSearchParams(window.location.search);
        var targetId = params.get('id') || params.get('aff') || params.get('to');

        // 如果没有参数，尝试从 hash 中获取
        if (!targetId && window.location.hash) {
          targetId = window.location.hash.replace(/^#\/?/, '');
        }

        var target = targetId ? REDIRECT_MAP[targetId.toLowerCase()] : null;

        if (target) {
          document.getElementById('target-name').textContent = '正在前往 ' + target.name;
          document.getElementById('manual-link').href = target.url;

          if (target.coupon) {
            document.getElementById('coupon-area').style.display = 'block';
            document.getElementById('coupon-val').textContent = target.coupon;
            document.getElementById('coupon-desc').textContent = '(' + target.discount + ')';
          }

          // 核心重定向：采用 replace 避免用户回退死循环
          setTimeout(function() {
            window.location.replace(target.url);
          }, 350);
        } else {
          // 未匹配到 ID 时的安全回退
          document.getElementById('target-name').textContent = '即将返回主页';
          document.getElementById('status-text').textContent = '未识别到有效的机场链接参数，安全起见正在为您返回网站首页...';
          document.getElementById('manual-link').href = './index.html';
          document.getElementById('manual-link').textContent = '立即返回首页';
          setTimeout(function() {
            window.location.replace('./index.html');
          }, 2000);
        }
      })();
    </script>
  </body>
</html>

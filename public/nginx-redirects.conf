# ==============================================================================
# Nginx 302 AFF 推广隔离与 SEO 权重保全配置
# 适用环境：VPS / 宝塔面板 (aaPanel) / 1Panel / LNMP / Docker Nginx
# 使用方法：在站点 server 块内引入此文件：
#     include /path/to/nginx-redirects.conf;
# ==============================================================================

# 1. 承接页 robots 标头保全
location = /go.html {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
}

